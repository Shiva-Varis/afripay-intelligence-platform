services:
  generator:
    build: .
    env_file: 
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy


  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afripay_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afripay}
      POSTGRES_DB: ${POSTGRES_DB:-afripay_db}
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/afripay_tb.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afripay_user} -d ${POSTGRES_DB:-afripay_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

